<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northline Admin</title>
<style>
:root{--black:#070707;--charcoal:#0d0d0d;--line:#242424;--white:#f5f4ef;--grey:#989792}
*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--white);font-family:Inter,Arial,sans-serif}
main{max-width:1200px;margin:auto;padding:56px 24px}.eyebrow{color:var(--grey);font-size:12px;letter-spacing:.14em}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:34px}h1{font-size:clamp(40px,7vw,76px);line-height:.9;margin:10px 0 0;letter-spacing:-.04em}.status{border:1px solid var(--line);padding:12px 14px;color:var(--grey);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid var(--line);background:var(--charcoal);padding:22px;min-height:150px}.num{font-size:12px;color:var(--grey)}.value{font-size:42px;margin-top:28px}.section{margin-top:42px}.section h2{font-size:22px;margin:0 0 14px}.empty{border:1px dashed var(--line);padding:32px;color:var(--grey)}
@media(max-width:700px){.head{display:block}.status{display:inline-block;margin-top:20px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="head"><div><div class="eyebrow">NORTHLINE / INTERNAL</div><h1>Admin.</h1></div><div class="status">Protected dashboard foundation</div></div>
<div class="grid">
<div class="card"><div class="num">01 / BRAND BRIEFS</div><div class="value" id="brands">—</div></div>
<div class="card"><div class="num">02 / TALENT APPLICATIONS</div><div class="value" id="talent">—</div></div>
<div class="card"><div class="num">03 / TOTAL SUBMISSIONS</div><div class="value" id="total">—</div></div>
</div>
<section class="section"><h2>Recent submissions</h2><div id="recent" class="empty">Loading...</div></section>
</main>
<script>
fetch('/api/submissions').then(r=>r.json()).then(d=>{
document.querySelector('#brands').textContent=d.counts?.brand||0;
document.querySelector('#talent').textContent=d.counts?.talent||0;
document.querySelector('#total').textContent=d.counts?.total||0;
const el=document.querySelector('#recent');
if(!d.recent?.length){el.textContent='No submissions yet.';return}
el.innerHTML=d.recent.map(x=>'<div style="padding:14px 0;border-bottom:1px solid #242424"><b>'+x.type.replace('-',' ')+'</b><div style="color:#989792;margin-top:5px">'+new Date(x.createdAt).toLocaleString()+'</div></div>').join('');
}).catch(()=>document.querySelector('#recent').textContent='Admin API is not configured yet.');
</script>
</body>
</html>
