<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Northline Admin</title>
<style>
:root{--b:#070707;--c:#0d0d0d;--l:#242424;--w:#f5f4ef;--g:#989792}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--w);font-family:Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}main{max-width:1280px;margin:auto;padding:40px 24px 80px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.eyebrow,.key,.num{color:var(--g);font-size:11px;letter-spacing:.12em}.head h1{font-size:clamp(42px,7vw,76px);line-height:.9;margin:10px 0 0;letter-spacing:-.05em}.head-actions{display:flex;gap:8px;align-items:center}.status,.btn,.tab{border:1px solid var(--l);background:#111;color:var(--w);padding:10px 14px}.login{max-width:430px}.login input{width:100%;padding:14px;background:var(--c);border:1px solid var(--l);color:var(--w)}.login button{margin-top:10px;background:var(--w);color:var(--b);font-weight:700}.app{display:none}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--l);padding-bottom:12px;overflow:auto}.tab.active{background:var(--w);color:var(--b)}.panel{display:none;padding-top:28px}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.talent{border:1px solid var(--l);background:var(--c);padding:20px}.value{font-size:40px;margin-top:24px}.toolbar{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;margin-bottom:16px}.control,.note{width:100%;padding:12px 13px;background:var(--c);border:1px solid var(--l);color:var(--w)}.row{padding:17px 0;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:18px}.meta{color:var(--g);font-size:12px;margin-top:5px}.badge{border:1px solid var(--l);padding:6px 8px;color:var(--g);font-size:11px}.detail{display:none;margin-top:18px}.detail-card{border:1px solid var(--l);background:var(--c);padding:22px}.detail-row{display:grid;grid-template-columns:170px 1fr;gap:18px;padding:12px 0;border-bottom:1px solid #1b1b1b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.danger{border-color:#553333}.note{min-height:140px;resize:vertical;margin-top:8px}.talent-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.talent h2{margin:7px 0 5px;font-size:24px}.talent p{color:#aaa;line-height:1.5}.empty{border:1px dashed var(--l);padding:20px;color:var(--g)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.talent-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){main{padding:28px 16px}.head{display:block}.status{display:inline-block;margin-top:16px}.grid,.talent-grid,.toolbar{grid-template-columns:1fr}.detail-row{grid-template-columns:1fr;gap:5px}}
</style></head><body><main>
<header class="head"><div><div class="eyebrow">NORTHLINE / INTERNAL OS</div><h1>Admin.</h1></div><div class="head-actions"><button class="btn" id="logout" hidden>Log out</button><div class="status" id="status">Admin access</div></div></header>
<section id="login" class="login"><form id="loginForm"><input id="password" type="password" placeholder="Admin password" autocomplete="current-password" required><button class="btn">Enter Admin</button></form></section>
<section id="app" class="app"><nav class="tabs"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="talentPanel">Talent</button><button class="tab" data-tab="submissions">Submissions</button></nav>
<section id="overview" class="panel active"><div class="grid"><div class="card"><div class="num">01 / BRAND BRIEFS</div><div class="value" id="brands">0</div></div><div class="card"><div class="num">02 / TALENT APPLICATIONS</div><div class="value" id="talentCount">0</div></div><div class="card"><div class="num">03 / CONTACTS</div><div class="value" id="contacts">0</div></div><div class="card"><div class="num">04 / TOTAL</div><div class="value" id="total">0</div></div></div><div class="card" style="margin-top:18px"><div class="num">SYSTEM</div><p id="system" style="color:#aaa;line-height:1.6">Loading...</p></div></section>
<section id="talentPanel" class="panel"><div class="toolbar"><input id="talentSearch" class="control" placeholder="Search talent..."><select id="talentFilter" class="control"><option value="all">All statuses</option><option>active</option><option>paused</option><option>prospect</option><option>former</option></select></div><div id="talentGrid" class="talent-grid"><div class="empty">Loading talent...</div></div><div id="talentDetail" class="detail"></div></section>
<section id="submissions" class="panel"><div class="toolbar"><input id="search" class="control" placeholder="Search submissions..."><select id="typeFilter" class="control"><option value="all">All types</option><option value="brand-brief">Brand briefs</option><option value="talent-application">Talent applications</option><option value="contact">Contacts</option></select><select id="statusFilter" class="control"><option value="all">All statuses</option><option>new</option><option>reviewing</option><option>contacted</option><option>closed</option></select></div><div id="recent" class="empty">Loading submissions...</div><div id="submissionDetail" class="detail"></div></section>
</section></main>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let subs=[],talent=[],currentSub,currentTalent;
function renderSubs(){const q=$('#search').value.toLowerCase(),t=$('#typeFilter').value,s=$('#statusFilter').value,a=subs.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(t==='all'||x.type===t)&&(s==='all'||(x.status||'new')===s));if(!a.length){$('#recent').textContent='No submissions match your filters.';return}$('#recent').innerHTML=a.map(x=>'<div class="row" data-id="'+x.id+'"><div><b>'+esc(x.type.replaceAll('-',' '))+'</b><div class="meta">#'+x.id+' · '+new Date(x.createdAt).toLocaleString()+'</div></div><span class="badge">'+esc(x.status||'new')+'</span></div>').join('');$$('#recent .row').forEach(r=>r.onclick=()=>showSub(subs.find(x=>String(x.id)===r.dataset.id)));}
function showSub(x){currentSub=x;const d=$('#submissionDetail');d.style.display='block';d.innerHTML='<div class="detail-card"><div class="eyebrow">SUBMISSION #'+x.id+'</div><h2>'+esc(x.type.replaceAll('-',' '))+'</h2>'+Object.entries(x.data||{}).map(([k,v])=>'<div class="detail-row"><div class="key">'+esc(k)+'</div><div>'+esc(v)+'</div></div>').join('')+'<div class="actions"><select id="subStatus" class="btn"><option>new</option><option>reviewing</option><option>contacted</option><option>closed</option></select><button class="btn" id="saveSub">Save Status</button><button class="btn danger" id="delSub">Delete</button><button class="btn" id="closeSub">Close</button></div></div>';$('#subStatus').value=x.status||'new';$('#saveSub').onclick=saveSub;$('#delSub').onclick=delSub;$('#closeSub').onclick=()=>d.style.display='none'}
async function saveSub(){const r=await fetch('/api/submissions',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({id:currentSub.id,status:$('#subStatus').value})});if(!r.ok)return alert('Could not update.');currentSub.status=$('#subStatus').value;await loadSubs();showSub(currentSub)}
async function delSub(){if(!confirm('Delete submission #'+currentSub.id+'?'))return;const r=await fetch('/api/submissions?id='+currentSub.id,{method:'DELETE'});if(!r.ok)return alert('Could not delete.');$('#submissionDetail').style.display='none';loadSubs()}
function renderTalent(){const q=$('#talentSearch').value.toLowerCase(),f=$('#talentFilter').value,a=talent.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(f==='all'||(x.internalStatus||'active')===f));if(!a.length){$('#talentGrid').innerHTML='<div class="empty">No talent found.</div>';return}$('#talentGrid').innerHTML=a.map(x=>'<article class="talent"><div class="eyebrow">'+esc(x.category)+' / '+esc(x.discipline)+'</div><h2>'+esc(x.name)+'</h2><div class="meta">@'+esc(x.handle)+' · '+esc(x.internalStatus||'active')+'</div><p>'+esc(x.bio)+'</p><div class="actions"><button class="btn" data-h="'+esc(x.handle)+'">Manage</button><a class="btn" href="'+esc(x.profile)+'" target="_blank" rel="noreferrer">Profile</a></div></article>').join('');$$('#talentGrid [data-h]').forEach(b=>b.onclick=()=>showTalent(talent.find(x=>x.handle===b.dataset.h)))}
function showTalent(x){currentTalent=x;const d=$('#talentDetail');d.style.display='block';d.innerHTML='<div class="detail-card"><div class="eyebrow">TALENT / INTERNAL PROFILE</div><h2>'+esc(x.name)+'</h2><div class="detail-row"><div class="key">Handle</div><div>@'+esc(x.handle)+'</div></div><div class="detail-row"><div class="key">Discipline</div><div>'+esc(x.discipline)+'</div></div><div class="detail-row"><div class="key">Internal status</div><select id="talentStatus" class="btn"><option>active</option><option>paused</option><option>prospect</option><option>former</option></select></div><div style="margin-top:18px"><div class="key">Internal note</div><textarea id="talentNote" class="note" maxlength="4000" placeholder="Partnership context, follow-ups, reminders...">'+esc(x.note||'')+'</textarea></div><div class="actions"><button class="btn" id="saveTalent">Save Talent</button><button class="btn" id="closeTalent">Close</button></div></div>';$('#talentStatus').value=x.internalStatus||'active';$('#saveTalent').onclick=saveTalent;$('#closeTalent').onclick=()=>d.style.display='none'}
async function saveTalent(){const r=await fetch('/api/talent',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({talentHandle:currentTalent.handle,status:$('#talentStatus').value,note:$('#talentNote').value})});if(!r.ok){const x=await r.json().catch(()=>({}));return alert(x.error||'Could not save.')}currentTalent.internalStatus=$('#talentStatus').value;currentTalent.note=$('#talentNote').value;renderTalent();showTalent(currentTalent)}
async function loadSubs(){const r=await fetch('/api/submissions');if(r.status===401)return location.reload();const d=await r.json();if(!d.ok)throw Error(d.error);$('#brands').textContent=d.counts.brand||0;$('#talentCount').textContent=d.counts.talent||0;$('#contacts').textContent=d.counts.contact||0;$('#total').textContent=d.counts.total||0;subs=d.recent||[];renderSubs()}
async function loadTalent(){const r=await fetch('/api/talent');if(r.status===401)return location.reload();const d=await r.json();if(!d.ok)throw Error(d.error);talent=d.talent||[];renderTalent()}
async function loadApp(){try{await Promise.all([loadSubs(),loadTalent()]);$('#system').textContent='Authenticated. Submission pipeline and talent management are online.'}catch(e){$('#system').textContent=e.message||'An internal system is unavailable.'}}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));$$('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});['search','typeFilter','statusFilter'].forEach(i=>$('#'+i).oninput=renderSubs);['talentSearch','talentFilter'].forEach(i=>$('#'+i).oninput=renderTalent);
$('#logout').onclick=async()=>{await fetch('/api/admin',{method:'DELETE'});location.reload()};$('#loginForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#password').value})});if(!r.ok){$('#status').textContent='Invalid password';return}$('#password').value='';$('#login').style.display='none';$('#app').style.display='block';$('#logout').hidden=false;$('#status').textContent='Authenticated';loadApp()}; 
</script></body></html>
